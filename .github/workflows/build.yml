name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'badge/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'badge/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build & Package Windows Portable
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_release.ps1

      - name: Upload Portable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matcast-Windows-Portable
          path: dist/Matcast-Windows-Portable.zip
          retention-days: 30

      - name: Update Works on My Machine badge
        if: always() && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $status = if ('${{ job.status }}' -eq 'success') { 'brightgreen' } else { 'red' }
          $json = @{
            schemaVersion = 1
            label = "works on"
            message = "my machine"
            color = $status
          } | ConvertTo-Json
          Set-Content -Path "badge/status.json" -Value $json -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badge/status.json
          $hasChanges = (git status --porcelain badge/status.json)
          if ($hasChanges) {
            git commit -m "chore: update badge status [skip ci]"
            git push
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Matcast-Windows-Portable.zip
          generate_release_notes: true
