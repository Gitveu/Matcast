name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build & Package Windows Portable
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_release.ps1

      - name: Upload Portable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matcast-Windows-Portable
          path: dist/Matcast-Windows-Portable.zip
          retention-days: 30

      - name: Update Works on My Machine badge
        if: always() && github.ref == 'refs/heads/main'
        uses: PetriLahdelma/works-on-my-machine-badge@v0
        with:
          state: ${{ job.status }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Matcast-Windows-Portable.zip
          generate_release_notes: true
